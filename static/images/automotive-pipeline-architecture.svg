  <text class="small" x="754" y="747" text-anchor="middle">Custom Deadline render plugins</text>
  <text class="small" x="754" y="772" text-anchor="middle">Submission internals and execution details omitted</text>

  <rect class="panel" x="40" y="862" width="1000" height="88" rx="6"/>
  <text class="label" x="62" y="891">SUPPORTING PRODUCTION INFRASTRUCTURE</text>
  <text class="body" x="62" y="925">Perforce stream organization</text>
  <text class="body" x="615" y="925">Jenkins CI/CD</text>
  <text class="small" x="40" y="978">Conceptual relationships only. Proprietary assets, service topology, and source code are omitted.</text>
</svg>
