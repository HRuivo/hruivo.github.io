<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="990" viewBox="0 0 1080 990" role="img" aria-labelledby="title desc">
  <title id="title">Multi-brand automotive CGI pipeline: conceptual architecture</title>
  <desc id="desc">Brand-specific imports converge on a common vehicle data structure used by shared Unreal Engine tools. A separate web layer uses SvelteKit, Bun, Python and FastAPI, deployed with Docker. Unreal and browser workflows can each initiate Deadline rendering using custom render plugins. Perforce stream organization and Jenkins CI/CD support the pipeline. This is a conceptual overview, not a service or deployment topology.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5Z" fill="#40634a"/></marker>
    <style>
      .paper { fill: #faf9f6; } .panel { fill: #f2f2ed; stroke: #deded8; stroke-width: 1.5; }
      .card { fill: #faf9f6; stroke: #b7bfb4; stroke-width: 1.5; } .highlight { fill: #e6ede2; stroke: #40634a; stroke-width: 1.5; }
      text { font-family: system-ui, sans-serif; fill: #20211f; } .heading { font-size: 25px; font-weight: 600; }
      .label { font-size: 17px; letter-spacing: 1.3px; fill: #40634a; } .body { font-size: 20px; } .small { font-size: 17px; fill: #62655f; }
      .arrow { fill: none; stroke: #40634a; stroke-width: 2; marker-end: url(#arrow); }
      @media (prefers-color-scheme: dark) {
        .paper, .card { fill: #20251f; } .panel { fill: #282e27; stroke: #60685d; } .card { stroke: #7b8776; }
        .highlight { fill: #34482f; stroke: #acc6a0; } text { fill: #f2f2ed; } .small { fill: #c0c8bc; } .label { fill: #b4cda9; }
        .arrow { stroke: #acc6a0; } marker path { fill: #acc6a0; }
      }
    </style>
  </defs>
