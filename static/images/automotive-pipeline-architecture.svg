  <text class="heading" x="40" y="83">Multi-brand automotive CGI pipeline</text>
  <text class="small" x="40" y="113">Simplified, sanitized conceptual architecture. Brand labels are fictional.</text>

  <rect class="panel" x="40" y="145" width="580" height="430" rx="6"/>
  <text class="label" x="62" y="179">VEHICLE DATA &amp; SHARED TOOLS</text>
  <rect class="card" x="62" y="201" width="165" height="84" rx="4"/>
  <rect class="card" x="247" y="201" width="165" height="84" rx="4"/>
  <rect class="card" x="432" y="201" width="165" height="84" rx="4"/>
  <text class="body" x="144" y="234" text-anchor="middle">Brand A</text>
  <text class="small" x="144" y="261" text-anchor="middle">Specific import</text>
  <text class="body" x="329" y="234" text-anchor="middle">Brand B</text>
  <text class="small" x="329" y="261" text-anchor="middle">Specific import</text>
  <text class="body" x="514" y="234" text-anchor="middle">Brand C</text>
  <text class="small" x="514" y="261" text-anchor="middle">Specific import</text>
  <path class="arrow" d="M144 285v22h185v28"/>
  <path class="arrow" d="M329 285v50"/>
  <path class="arrow" d="M514 285v22H329v28"/>
  <rect class="highlight" x="106" y="337" width="448" height="76" rx="4"/>
  <text class="body" x="330" y="369" text-anchor="middle">Common vehicle data structure</text>
  <text class="small" x="330" y="395" text-anchor="middle">Consistent input for downstream components</text>
  <path class="arrow" d="M330 413v37"/>
  <rect class="card" x="106" y="452" width="448" height="93" rx="4"/>
  <text class="body" x="330" y="486" text-anchor="middle">Shared Unreal Engine tooling</text>
  <text class="small" x="330" y="515" text-anchor="middle">Reusable plugins · Production &amp; rigging tools</text>

  <rect class="panel" x="646" y="145" width="394" height="430" rx="6"/>
  <text class="label" x="670" y="179">WEB COMPONENTS</text>
  <rect class="card" x="670" y="201" width="346" height="94" rx="4"/>
