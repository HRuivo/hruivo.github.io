  <text class="body" x="843" y="352" text-anchor="middle">Backend REST services</text>
  <text class="small" x="843" y="382" text-anchor="middle">Python · FastAPI</text>
  <text class="body" x="670" y="454">Docker deployment</text>
  <text class="small" x="670" y="483">Web frontend and backend only.</text>
  <text class="small" x="670" y="520">API and integration paths omitted.</text>
  <text class="small" x="670" y="546">Boxes do not indicate deployment units.</text>

